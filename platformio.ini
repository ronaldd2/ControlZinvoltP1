; PlatformIO Project Configuration File for ControlZinvoltP1
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-mini-1]
platform = espressif32
# ESP32-S3-Mini-1 module (8MB flash, no PSRAM)
# Use devkitc-1 base and override flash/psram
board = esp32-s3-devkitc-1
framework = arduino

; Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=3 
    -DMQTT_MAX_PACKET_SIZE=2048
board_build.flash_size = 8MB
board_build.psram = disabled
    
; Library dependencies
lib_deps = 
    esphome/AsyncTCP-esphome@^2.1.3
    me-no-dev/ESPAsyncWebServer@^1.2.3
    bblanchon/ArduinoJson@^7.2.0
    WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
    
; Upload options
upload_speed = 921600
; USB upload (auto-detect COM port)
; Uncomment to use a specific COM port:
; upload_port = COM3
; Or use OTA (wireless upload):
upload_protocol = espota
upload_port = 192.168.12.57
; upload_flags =
;     --auth=your-ota-password-if-set

